[package]
name = "loreloom-content"
version = "0.1.0-alpha.0"
edition = "2024"
description = "Versioned world content, mod packages, and definition compilation for Loreloom"
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
loreloom-core = { version = "0.1.0-alpha.0", path = "../loreloom-core" }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0.20"
toml = "1"

[dev-dependencies]
tempfile = "3.27.0"
