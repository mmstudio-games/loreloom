[package]
name = "loreloom-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
loreloom-core = { version = "0.1.0", path = "../loreloom-core" }

[dev-dependencies]
armillae-core = { git = "https://github.com/mmstudio-games/armillae", rev = "c9896fc4eb3a4f37918c0cabcefc84f8dcd69137" }
armillae-llm = { git = "https://github.com/mmstudio-games/armillae", rev = "c9896fc4eb3a4f37918c0cabcefc84f8dcd69137", features = ["mock"] }
armillae-tools = { git = "https://github.com/mmstudio-games/armillae", rev = "c9896fc4eb3a4f37918c0cabcefc84f8dcd69137" }
futures-executor = "0.3.31"
futures-util = "0.3.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
