[package]
name = "loreloom-agent"
version = "0.1.0"
edition = "2024"
description = "Agent harness, model context, and tool-loop orchestration for Loreloom"
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
armillae-core = { git = "https://github.com/mmstudio-games/armillae", rev = "b2208f9c4c27f9b8bb1101919038beb0d3a938fe", version = "0.1.0-alpha.1" }
armillae-llm = { git = "https://github.com/mmstudio-games/armillae", rev = "b2208f9c4c27f9b8bb1101919038beb0d3a938fe", version = "0.1.0-alpha.1" }
armillae-tools = { git = "https://github.com/mmstudio-games/armillae", rev = "b2208f9c4c27f9b8bb1101919038beb0d3a938fe", version = "0.1.0-alpha.1" }
futures-util = "0.3.34"
loreloom-core = { version = "0.1.0", path = "../loreloom-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[dev-dependencies]
armillae-llm = { git = "https://github.com/mmstudio-games/armillae", rev = "b2208f9c4c27f9b8bb1101919038beb0d3a938fe", features = ["mock"] }
futures-executor = "0.3.31"
