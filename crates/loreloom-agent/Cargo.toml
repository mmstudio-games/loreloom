armillae-llm = { git = "https://github.com/mmstudio-games/armillae", rev = "c9896fc4eb3a4f37918c0cabcefc84f8dcd69137", version = "0.1.0-alpha.1" }
armillae-tools = { git = "https://github.com/mmstudio-games/armillae", rev = "c9896fc4eb3a4f37918c0cabcefc84f8dcd69137", version = "0.1.0-alpha.1" }
futures-util = "0.3.34"
