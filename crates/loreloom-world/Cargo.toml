[package]
name = "loreloom-world"
version = "0.1.0"
edition = "2024"

[dependencies]
loreloom-content = { version = "0.1.0", path = "../loreloom-content" }
loreloom-core = { version = "0.1.0", path = "../loreloom-core" }

[dev-dependencies]
armillae-simulate = { git = "https://github.com/mmstudio-games/armillae", rev = "c9896fc4eb3a4f37918c0cabcefc84f8dcd69137" }
armillae-simulate-bevy = { git = "https://github.com/mmstudio-games/armillae", rev = "c9896fc4eb3a4f37918c0cabcefc84f8dcd69137" }
bevy_ecs = { version = "=0.19.1", default-features = false, features = ["std"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
