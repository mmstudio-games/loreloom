[package]
name = "loreloom-world"
version = "0.1.0-alpha.0"
edition = "2024"
description = "Authoritative Bevy ECS world and gameplay systems for Loreloom"
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
bevy_ecs = { version = "=0.19.1", default-features = false, features = ["std"] }
loreloom-content = { version = "0.1.0-alpha.0", path = "../loreloom-content" }
loreloom-core = { version = "0.1.0-alpha.0", path = "../loreloom-core" }
thiserror = "2.0.20"

[dev-dependencies]
armillae-simulate = { git = "https://github.com/mmstudio-games/armillae", rev = "c9896fc4eb3a4f37918c0cabcefc84f8dcd69137" }
armillae-simulate-bevy = { git = "https://github.com/mmstudio-games/armillae", rev = "c9896fc4eb3a4f37918c0cabcefc84f8dcd69137" }
schemars = { version = "1", features = ["derive"] }
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
