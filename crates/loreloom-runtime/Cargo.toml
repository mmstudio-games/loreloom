[package]
name = "loreloom-runtime"
version = "0.1.0-alpha.0"
edition = "2024"
description = "Application runtime and world coordination for Loreloom"
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
armillae-core = { git = "https://github.com/mmstudio-games/armillae", rev = "c9896fc4eb3a4f37918c0cabcefc84f8dcd69137", version = "0.1.0-alpha.1" }
armillae-llm = { git = "https://github.com/mmstudio-games/armillae", rev = "c9896fc4eb3a4f37918c0cabcefc84f8dcd69137", version = "0.1.0-alpha.1" }
armillae-tools = { git = "https://github.com/mmstudio-games/armillae", rev = "c9896fc4eb3a4f37918c0cabcefc84f8dcd69137", version = "0.1.0-alpha.1" }
loreloom-agent = { version = "0.1.0-alpha.0", path = "../loreloom-agent" }
loreloom-content = { version = "0.1.0-alpha.0", path = "../loreloom-content" }
loreloom-core = { version = "0.1.0-alpha.0", path = "../loreloom-core" }
loreloom-store = { version = "0.1.0-alpha.0", path = "../loreloom-store" }
loreloom-world = { version = "0.1.0-alpha.0", path = "../loreloom-world" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["sync", "rt", "macros", "rt-multi-thread"] }

[dev-dependencies]
armillae-llm = { git = "https://github.com/mmstudio-games/armillae", rev = "c9896fc4eb3a4f37918c0cabcefc84f8dcd69137", features = ["mock"] }
semver = "1.0.27"
tempfile = "3.27.0"
